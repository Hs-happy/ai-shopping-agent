<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小导 · 全渠道智能导购 Agent</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182033;
    --line: #1f2a41;
    --text: #e6ecf7;
    --muted: #8794ac;
    --accent: #5b8cff;
    --accent-2: #22d3a5;
    --warn: #f5a524;
    --danger: #f2555a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #17223a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 260px 1fr 340px; }
  /* ---------------- 侧栏 ---------------- */
  aside {
    border-right: 1px solid var(--line);
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 18px;
    background: rgba(10, 14, 22, .6);
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; color: #08101f; font-size: 18px;
  }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .block-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 7px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: .15s; text-align: left; white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: #cfe0ff; }
  .status { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); }
  .status .row { display: flex; justify-content: space-between; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
  .dot.off { background: var(--warn); }
  .sidebar-foot { margin-top: auto; font-size: 11px; color: #5d6a82; line-height: 1.6; }
  /* ---------------- 主区 ---------------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header.top {
    padding: 16px 26px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    backdrop-filter: blur(6px);
  }
  .top h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .top .sub {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52ch;
  }
  .badges { display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--panel);
  }
  .badge.ok { color: #8ff0d0; border-color: #1d5f4c; }
  .badge.warn { color: #ffd28a; border-color: #5a4420; }
  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 26px clamp(18px, 5vw, 64px); scroll-behavior: smooth; }
  .msg { max-width: 780px; margin: 0 auto 20px; display: flex; gap: 12px; }
  .msg.user { flex-direction: row-reverse; }
  .content { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; align-items: flex-start; }
  .msg.user .content { align-items: flex-end; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: var(--panel-2); color: #a9c0ff; border: 1px solid var(--line);
  }
  .msg.user .avatar { color: #9ef0d6; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 16px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); max-width: 100%;
  }
  .msg.user .bubble { background: linear-gradient(135deg, #1b2a4d, #16203a); border-color: #24365c; }
  .bubble b { color: #dbe7ff; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; width: 100%; }
  .card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    font-size: 12px; line-height: 1.6; transition: .15s;
  }
  .card:hover { border-color: #33507f; transform: translateY(-1px); }
  .card .title { font-weight: 600; font-size: 12.5px; margin-bottom: 6px; }
  .card .price { color: #ffd28a; font-weight: 700; font-size: 15px; }
  .card .meta { color: var(--muted); margin-top: 4px; }
  .card .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { background: #1c2942; color: #9fb6df; border-radius: 6px; padding: 2px 6px; font-size: 10.5px; }
  .tag.hit { background: #143a2f; color: #8ff0d0; }
  .slotbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .slot { font-size: 11px; color: #a9c0ff; background: #16213a; border: 1px solid #26375a; padding: 3px 8px; border-radius: 999px; }
  .composer { border-top: 1px solid var(--line); padding: 14px clamp(18px, 5vw, 64px) 18px; }
  .input-wrap {
    max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 14px;
  }
  .input-wrap:focus-within { border-color: #33507f; box-shadow: 0 0 0 3px rgba(91,140,255,.12); }
  textarea {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); resize: none;
    font: inherit; font-size: 14px; line-height: 1.6; max-height: 120px; padding: 6px 0;
  }
  textarea::placeholder { color: #5d6a82; }
  button.send {
    border: 0; background: linear-gradient(135deg, var(--accent), #6f6bff); color: white;
    padding: 10px 18px; border-radius: 11px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: not-allowed; }
  /* ---------------- 右侧 trace ---------------- */
  .trace {
    border-left: 1px solid var(--line); background: rgba(9, 13, 20, .55);
    padding: 18px 16px; overflow-y: auto;
  }
  .trace h3 { font-size: 12px; margin: 0 0 4px; color: #cfe0ff; letter-spacing: .3px; }
  .trace .hint { font-size: 11px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .step {
    border-left: 2px solid var(--line); padding: 0 0 14px 14px; margin-left: 4px; position: relative;
    font-size: 11.5px; color: var(--muted); animation: fade .25s ease;
  }
  .step::before {
    content: ""; position: absolute; left: -5px; top: 3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.15);
  }
  .step.done::before { background: var(--accent-2); box-shadow: 0 0 0 3px rgba(34,211,165,.15); }
  .step.warn::before { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,165,36,.15); }
  .step .k { color: #cfe0ff; font-weight: 600; }
  .step .v { color: #8fa5c9; }
  .step pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; color: #7f90ad; font-size: 10.5px; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } }
  .empty-trace { color: #4d5972; font-size: 11.5px; line-height: 1.7; }
  @media (max-width: 1180px) { .app { grid-template-columns: 1fr; } aside, .trace { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo">导</div>
      <div>
        <h1>小导 · 导购 Agent</h1>
        <p>LangGraph · 混合检索 · MCP</p>
      </div>
    </div>

    <div>
      <p class="block-title">试试这样问</p>
      <div class="chips" id="examples">
        <button class="chip">5000以内拍照好的手机</button>
        <button class="chip">通勤用的降噪耳机，1000左右</button>
        <button class="chip">学生党轻薄本，预算6000</button>
        <button class="chip">想买个相机拍vlog</button>
        <button class="chip">华为和荣耀的手机哪个好</button>
        <button class="chip">推荐个送女朋友的礼物</button>
      </div>
    </div>

    <div>
      <p class="block-title">运行状态</p>
      <div class="status" id="status">
        <div class="row"><span><span class="dot off"></span>模型</span><span id="st-model">检测中…</span></div>
        <div class="row"><span><span class="dot off"></span>向量后端</span><span id="st-embed">-</span></div>
        <div class="row"><span><span class="dot off"></span>商品库</span><span id="st-docs">-</span></div>
        <div class="row"><span><span class="dot off"></span>MCP 工具</span><span id="st-mcp">-</span></div>
      </div>
    </div>

    <div class="sidebar-foot">
      会话 <code id="sid"></code><br />
      多轮槽位会自动累积；点右上角「新会话」重置。
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h2>全渠道智能导购</h2>
        <div class="sub">模糊需求 → 槽位补全 → BM25 + 向量双路召回 → RRF → 重排 → 库存校验 → 流式回答</div>
      </div>
      <div class="badges">
        <span class="badge" id="badge-conf">置信度 -</span>
        <span class="badge" id="badge-lat">- ms</span>
        <span class="badge" id="badge-deg" style="display:none">降级</span>
        <button class="chip" id="new-session">新会话</button>
      </div>
    </header>

    <div id="chat"></div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="说说你的需求，比如：5000 以内拍照好一点的手机…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
      </div>
    </div>
  </main>

  <div class="trace">
    <h3>检索链路 · 实时</h3>
    <div class="hint">这里展示每个阶段的真实输出：槽位、双路召回名次、RRF、重排分、工具耗时、降级原因。</div>
    <div id="trace-body" class="empty-trace">发送一条消息后，这里会逐步亮起。</div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const chat = $("#chat"), traceBody = $("#trace-body");
  const input = $("#input"), sendBtn = $("#send");
  let sessionId = localStorage.getItem("xiaodao_sid") || Math.random().toString(36).slice(2, 14);
  localStorage.setItem("xiaodao_sid", sessionId);
  $("#sid").textContent = sessionId;
  let busy = false;
  let current = null;

  const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");

  function addMsg(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    wrap.innerHTML = `<div class="avatar">${role === "user" ? "我" : "导"}</div>
      <div class="content"><div class="bubble ${role === "bot" ? "cursor" : ""}">${md(text)}</div></div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap.querySelector(".bubble");
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }

  function step(k, v, cls = "") {
    if (!traceBody.dataset.live) { traceBody.innerHTML = ""; traceBody.dataset.live = "1"; }
    const el = document.createElement("div");
    el.className = "step " + cls;
    el.innerHTML = `<div><span class="k">${k}</span> <span class="v">${v || ""}</span></div>`;
    traceBody.appendChild(el);
    traceBody.scrollTop = traceBody.scrollHeight;
    return el;
  }

  function renderCards(products, bubble) {
    if (!products || !products.length) return;
    const box = document.createElement("div");
    box.className = "cards";
    box.innerHTML = products.map((p) => `
      <div class="card">
        <div class="title">${esc(p.title)}</div>
        <div class="price">¥${Math.round(p.price)}</div>
        <div class="meta">${esc(p.brand)} · ${esc(p.category)} · ⭐${p.rating} · ${p.available === false ? "缺货" : "有货"}</div>
        <div class="tags">${(p.tags || []).slice(0, 4).map((t) => `<span class="tag hit">${esc(t)}</span>`).join("")}
          ${(p.reasons || []).slice(0, 2).map((r) => `<span class="tag">${esc(r)}</span>`).join("")}</div>
      </div>`).join("");
    bubble.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderSlots(slots) {
    if (!slots) return;
    const bits = [];
    if (slots.category) bits.push("品类: " + slots.category);
    if (slots.brand) bits.push("品牌: " + slots.brand);
    if (slots.price_min && slots.price_max) bits.push(`预算: ¥${slots.price_min}-${slots.price_max}`);
    else if (slots.price_max) bits.push("预算: ≤¥" + slots.price_max);
    else if (slots.price_min) bits.push("预算: ≥¥" + slots.price_min);
    if (slots.attributes && slots.attributes.length) bits.push("需求: " + slots.attributes.join(" / "));
    if (slots.scene) bits.push("场景: " + slots.scene);
    if (bits.length) step("槽位解析", bits.join(" · "), "done");
  }

  function handle(evt) {
    const { type, data } = evt;
    if (type === "slots") {
      renderSlots(data.slots);
      if (current) {
        const bar = document.createElement("div");
        bar.className = "slotbar";
        const s = data.slots || {};
        const chips = [];
        if (s.category) chips.push("品类 " + s.category);
        if (s.brand) chips.push("品牌 " + s.brand);
        if (s.price_max) chips.push("预算 ≤" + Math.round(s.price_max));
        if (s.price_min) chips.push("预算 ≥" + Math.round(s.price_min));
        (s.attributes || []).forEach((a) => chips.push(a));
        if (s.scene) chips.push(s.scene);
        bar.innerHTML = chips.map((c) => `<span class="slot">${esc(c)}</span>`).join("");
        if (chips.length) current.closest(".content").appendChild(bar);
      }
    } else if (type === "intent") {
      step("意图识别", data.intent, "done");
    } else if (type === "retrieval") {
      const st = data.stats || {};
      step("双路召回", `BM25 ${st.bm25_hits} 条 / 向量 ${st.vector_hits} 条 → RRF 融合 ${st.fused} 条`, "done");
      step("重排", `${st.reranker} · 置信度 ${(data.confidence * 100).toFixed(1)}%`, data.confidence < 0.42 ? "warn" : "done");
      const lat = st.latency || {};
      step("检索耗时", `BM25 ${lat.bm25_ms}ms · 向量 ${lat.vector_ms}ms · 重排 ${lat.rerank_ms}ms`, "done");
      if (data.relaxed && data.relaxed.length) step("约束放宽", data.relaxed.join(", "), "warn");
      $("#badge-conf").textContent = "置信度 " + (data.confidence * 100).toFixed(1) + "%";
      $("#badge-conf").className = "badge " + (data.confidence >= 0.42 ? "ok" : "warn");
    } else if (type === "rewrite") {
      step("Query 改写", `"${data.rewritten}"`, "warn");
    } else if (type === "tool_call") {
      step("工具调用", `${data.tool}(${(data.arguments.sku_ids || []).length} 个 SKU) · ${data.source}`, "done");
    } else if (type === "tool_result") {
      step(data.degraded ? "工具降级" : "工具返回",
        `${data.latency_ms}ms · ${data.degraded ? data.error || "超时，回退商品库快照" : (data.items || []).length + " 条库存"}`,
        data.degraded ? "warn" : "done");
      if (data.degraded) { const b = $("#badge-deg"); b.style.display = ""; }
    } else if (type === "delta") {
      if (!current) return;
      current.dataset.raw = (current.dataset.raw || "") + data.text;
      current.innerHTML = md(current.dataset.raw);
      chat.scrollTop = chat.scrollHeight;
    } else if (type === "products") {
      renderCards(data.products, current ? current.closest(".content") : chat);
    } else if (type === "clarify") {
      step("澄清追问", "信息不足，向用户提问", "warn");
    } else if (type === "done") {
      if (current) {
        current.classList.remove("cursor");
        if (!current.dataset.raw) current.innerHTML = md(data.answer || "");
      }
      const t = data.timings || {};
      $("#badge-lat").textContent = Math.round(t.total_ms || 0) + " ms";
      step("本轮结束", `总耗时 ${Math.round(t.total_ms || 0)}ms · 生成 ${Math.round(t.respond_ms || 0)}ms`, "done");
    } else if (type === "error") {
      if (current) { current.classList.remove("cursor"); current.textContent = "出错了：" + data.message; }
      step("异常", data.message, "warn");
    }
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    addMsg("user", text);
    current = addMsg("bot", "");
    traceBody.dataset.live = "";
    traceBody.innerHTML = "";
    $("#badge-conf").textContent = "置信度 -";
    $("#badge-lat").textContent = "- ms";
    $("#badge-deg").style.display = "none";
    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, session_id: sessionId }),
      });
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          let type = "message", data = {};
          raw.split("\n").forEach((line) => {
            if (line.startsWith("event:")) type = line.slice(6).trim();
            else if (line.startsWith("data:")) {
              try { data = JSON.parse(line.slice(5).trim()); } catch (e) {}
            }
          });
          handle({ type, data });
        }
      }
    } catch (e) {
      if (current) { current.classList.remove("cursor"); current.textContent = "请求失败：" + e.message; }
    } finally {
      if (current) current.classList.remove("cursor");
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.onclick = () => { const v = input.value; input.value = ""; autoGrow(); send(v); };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });
  input.addEventListener("input", autoGrow);
  document.querySelectorAll("#examples .chip").forEach((el) => {
    el.onclick = () => send(el.textContent);
  });
  $("#new-session").onclick = async () => {
    await fetch("/api/chat/session/" + sessionId, { method: "DELETE" }).catch(() => {});
    sessionId = Math.random().toString(36).slice(2, 14);
    localStorage.setItem("xiaodao_sid", sessionId);
    $("#sid").textContent = sessionId;
    chat.innerHTML = "";
    traceBody.innerHTML = '<div class="empty-trace">发送一条消息后，这里会逐步亮起。</div>';
    addMsg("bot", "新会话开始。想看点什么？告诉我品类、预算或者用途就行。");
  };

  async function boot() {
    try {
      const meta = await (await fetch("/api/meta")).json();
      const llm = meta.llm || {};
      $("#st-model").textContent = llm.enabled ? llm.model : "mock 规则模式";
      $("#st-embed").textContent = (meta.retrieval && meta.retrieval.vector && meta.retrieval.vector.backend) || "-";
      $("#st-docs").textContent = (meta.retrieval && meta.retrieval.docs || 0).toLocaleString() + " SKU";
      $("#st-mcp").textContent = "在线";
      document.querySelectorAll("#status .dot").forEach((d) => (d.className = "dot on"));
      if (meta.tools && meta.tools.length) {
        const t = meta.tools[0];
        $("#st-mcp").textContent = `在线 · ${Math.round(t.avg_ms || 0)}ms`;
      }
    } catch (e) {
      $("#st-model").textContent = "后端未连接";
    }
  }

  const welcome = addMsg("bot", "你好，我是小导。告诉我品类、预算和用途，我来帮你挑——比如「5000 以内拍照好的手机」，或者「通勤戴的降噪耳机」。");
  welcome.classList.remove("cursor");
  boot();
})();
</script>
</body>
</html>
